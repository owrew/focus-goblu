[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-goblu-local"
version = "0.4.0"
description = "Private local webcam attention estimates with an animated desktop goblin"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.gui-scripts]
focus-goblu = "focus_goblin.__main__:main"
focus-goblin = "focus_goblin.__main__:main"

[tool.setuptools.packages.find]
include = ["focus_goblin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
focus_goblin = ['assets/*.png', 'assets/*.ico', 'assets/*.md']
